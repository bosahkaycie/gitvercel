<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70" fill="none">
  <!-- NNPC Limited Emblem: Gear/Cogwheel -->
  <g transform="translate(12, 10)">
    <!-- Cog ring base -->
    <circle cx="25" cy="25" r="23" fill="#007A3D"/>
    <!-- Inner yellow band -->
    <circle cx="25" cy="25" r="17" fill="#FDB913"/>
    <!-- Inner green center -->
    <circle cx="25" cy="25" r="13" fill="#004D26"/>
    <!-- Central oil tower / derrick / flame symbol in red & gold -->
    <path d="M25 15 L28 32 L22 32 Z" fill="#E31B23"/>
    <path d="M25 18 L27 28 L23 28 Z" fill="#FDB913"/>
    <circle cx="25" cy="31" r="2.5" fill="#FFFFFF"/>
    <!-- Gear teeth around perimeter -->
    <circle cx="25" cy="25" r="21" stroke="#007A3D" stroke-width="4" stroke-dasharray="3.5 4"/>
  </g>
  <!-- NNPC LIMITED Wordmark -->
  <g transform="translate(74, 37)">
    <text font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#007A3D" letter-spacing="1">NNPC</text>
    <text x="2" y="16" font-family="system-ui, -apple-system, 'Arial', sans-serif" font-size="11" font-weight="700" fill="#333333" letter-spacing="3.5">LIMITED</text>
  </g>
</svg>

