<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 70" width="290" height="70" fill="none">
  <!-- Newcross Cross & Energy Orbit Emblem -->
  <g transform="translate(10, 11)">
    <!-- Blue diamond frame -->
    <rect x="5" y="5" width="38" height="38" rx="8" fill="#003366"/>
    <!-- Orange & White Cross symbol -->
    <path d="M24 12 L24 36" stroke="#FF6600" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M12 24 L36 24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Central dynamic intersection -->
    <circle cx="24" cy="24" r="3" fill="#FFCC00"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(64, 34)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#003366" letter-spacing="1">NEWCROSS</text>
    <text x="1" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FF6600" letter-spacing="1.5">EXPLORATION &amp; PRODUCTION</text>
  </g>
</svg>
